<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Architecture Portfolio | Horizontal Scroll</title>
    <style>
        :root {
            --bg-dark: #0a0a0a;
            --text-light: #f5f5f7;
            --gold-gradient: linear-gradient(90deg, #FFD700, #FFA500, #FFD700);
            --blue-purple: linear-gradient(135deg, #007aff, #6610f2, #6f42c1);
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: var(--text-light);
            background: var(--bg-dark);
            overflow-x: hidden;
            overscroll-behavior: none;
        }

        /* Smooth Scroll Helper */
        .container { width: 100%; }

        /* Intro Section */
        .hero {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: radial-gradient(circle at center, #1a1a1a 0%, #0a0a0a 100%);
        }

        .hero h1 {
            font-size: clamp(2.5rem, 8vw, 5rem);
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            letter-spacing: -2px;
        }

        /* The Horizontal Pinning Section */
        #sectionPin {
            height: 100vh;
            overflow: hidden;
            display: flex;
            background: #050505;
        }

        .pin-wrap {
            height: 100vh;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding: 0 10vw;
            will-change: transform;
        }

        /* Content Cards */
        .content-card {
            min-width: 70vw;
            margin-right: 5vw;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .text-section {
            min-width: 40vw;
        }

        .text-section h2 {
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            line-height: 1.2;
            background: var(--blue-purple);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .img-container {
            position: relative;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 20px;
            backdrop-filter: blur(10px);
            transition: transform 0.4s ease;
        }

        .img-container:hover {
            transform: translateY(-10px);
            border-color: #FFA500;
        }

        .pin-wrap img {
            height: 60vh;
            width: auto;
            max-width: 100%;
            object-fit: contain;
            border-radius: 12px;
            display: block;
        }

        /* Small caption for images */
        .img-caption {
            margin-top: 15px;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #888;
        }

        /* Responsive Tweaks */
        @media (max-width: 768px) {
            .content-card { min-width: 85vw; }
            .pin-wrap img { height: 45vh; }
            .text-section { min-width: 80vw; }
        }

        /* Scroll Progress Bar */
        .progress-bar {
            position: fixed;
            top: 0;
            left: 0;
            height: 4px;
            background: var(--gold-gradient);
            z-index: 1000;
            width: 0%;
        }
    </style>
</head>

<body>
    <div class="progress-bar"></div>

    <div class="container">

        <section id="sectionPin">
            <div class="pin-wrap">
                <div class="content-card text-section">
                    <h2>Modern System Designs<br>Built for Scalability & Speed.</h2>
                    <p style="color: #888;">Scroll down to explore the core infrastructures I've developed.</p>
                </div>

                <div class="content-card">
                    <div class="img-container">
                        <img src="./assets/img/Kafka.png" alt="Kafka Architecture">
                        <div class="img-caption">Event Streaming with Kafka</div>
                    </div>
                </div>

                <div class="content-card">
                    <div class="img-container">
                        <img src="./assets/img/Redis.png" alt="Redis Architecture">
                        <div class="img-caption">Distributed Caching with Redis</div>
                    </div>
                </div>

                <div class="content-card">
                    <div class="img-container">
                        <img src="./assets/img/Securoty.png" alt="Security Architecture">
                        <div class="img-caption">Zero-Trust Security Framework</div>
                    </div>
                </div>
            </div>
        </section>
        
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <script>
        gsap.registerPlugin(ScrollTrigger);

        window.addEventListener("load", function () {
            const pinWrap = document.querySelector(".pin-wrap");
            const horizontalScrollLength = pinWrap.scrollWidth - window.innerWidth;

            // Horizontal Scroll Timeline
            gsap.to(".pin-wrap", {
                scrollTrigger: {
                    trigger: "#sectionPin",
                    pin: true,
                    start: "top top",
                    end: () => `+=${pinWrap.scrollWidth}`,
                    scrub: 1, // Smooth scrub for premium feel
                    invalidateOnRefresh: true,
                    onUpdate: (self) => {
                        // Update progress bar
                        gsap.to(".progress-bar", { width: `${self.progress * 100}%`, duration: 0.1 });
                    }
                },
                x: -horizontalScrollLength,
                ease: "none"
            });

            // Refresh on resize for perfect alignment
            window.addEventListener('resize', () => ScrollTrigger.refresh());
        });
    </script>
</body>
</html>
